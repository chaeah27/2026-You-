<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>유리프 v2 프로토콜 검증 (서버 연결 없음)</title><style>body{font-family:system-ui,sans-serif;margin:35px auto;padding:0 18px;max-width:900px;color:#243c50}h1{font-size:1.6rem}.note{background:#eff6f9;padding:14px;border-radius:10px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}button{padding:10px 18px;background:#245d89;color:#fff;border:0;border-radius:8px;cursor:pointer}.ok{color:green}.bad{color:#ad271a}</style><script src="./experiment-v2-protocol.js"></script></head><body><h1>1차 실험 순서·시간 검증</h1><p class="note">개발 브랜치 전용 독립 테스트. Firebase, Arduino, 참가자 실데이터에는 접근하지 않습니다. 이 테스트가 통과해도 실제 장비·권한 테스트를 대신하지는 않습니다.</p><button id="run">새로 셔플·검증</button><p id="result" aria-live="polite"></p><table><thead><tr><th>번호</th><th>구간</th><th>분야</th><th>환경</th><th>설정 시간</th><th>설문</th></tr></thead><tbody id="list"></tbody></table><script>const names={visual:['어둡고 차가움','밝고 차가움','어둡고 따뜻함','밝고 따뜻함'],olfactory:['향수1','향수2','향수3','향수4'],auditory:['룩스 소리','자습실 소리']};document.querySelector('#run').onclick=()=>{try{const input={};for(const [type,n] of yurifV2Protocol.CATEGORIES)input[type]=names[type].map((name,i)=>({id:type+i,name}));const order=yurifV2Protocol.shuffledOrder(input),steps=yurifV2Protocol.makeSegments(order),duration=steps.reduce((a,x)=>a+x.duration,0),rests=steps.filter(x=>x.kind==='rest').length,surveys=steps.filter(x=>x.surveyAfter).length;const ok=steps.length===21&&duration===960&&rests===10&&surveys===7&&steps.at(-1).id==='rest-9';document.querySelector('#result').className=ok?'ok':'bad';document.querySelector('#result').textContent=(ok?'통과':'실패')+' · '+steps.length+'구간 · '+duration+'초 · 휴식 '+rests+'회 · 설문 '+surveys+'회';document.querySelector('#list').innerHTML=steps.map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+s.kind+'</td><td>'+s.type+'</td><td>'+s.name+'</td><td>'+s.duration+'초</td><td>'+(s.surveyAfter||'—')+'</td></tr>').join('')}catch(e){document.querySelector('#result').textContent='오류: '+e.message}};document.querySelector('#run').click();</script></body></html>
